name: Build MySQL RPMs
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ case(matrix.architecture == 'amd64', 'ubuntu-26.04', 'ubuntu-26.04-arm') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - amazonlinux2027
          - amazonlinux2023
          - almalinux10
          - almalinux9
          - almalinux8
          - rockylinux10
          - rockylinux9
          - rockylinux8
        architecture:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build MySQL RPMs
        run: |
          make ${{ matrix.distribution }}
        env:
          PLATFORM: linux/${{ matrix.architecture }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.distribution }}-${{ matrix.architecture }}
          path: ${{ matrix.distribution }}.build/
