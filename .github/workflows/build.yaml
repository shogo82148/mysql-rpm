name: Build MySQL RPMs
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - amazonlinux2023
          - almalinux10
          - rockylinux10
        architecture:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build MySQL RPMs
        run: |
          make ${{ matrix.distribution}}
        env:
          PLATFORM: ${{ matrix.architecture }}
