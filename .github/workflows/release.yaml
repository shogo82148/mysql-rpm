name: Release MySQL RPMs
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ case(matrix.architecture == 'amd64', 'ubuntu-26.04', 'ubuntu-26.04-arm') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - amazonlinux2027
          - amazonlinux2023
          - almalinux10
          - almalinux9
          - almalinux8
          - rockylinux10
          - rockylinux9
          - rockylinux8
        architecture:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build MySQL RPMs
        run: |
          make ${{ matrix.distribution }}
        env:
          PLATFORM: linux/${{ matrix.architecture }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::445285296882:role/rpm-repository-users-MySQLRpmDeployRole-V9QRTiRlJrQl
      - name: Publish Artifacts
        run: |
          ./upload.pl
