name: Update MySQL RPM Spec
on:
  schedule:
    - cron: "39 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Update spec
        run: ./download-source.sh
      - name: create a pull request if needed
        uses: shogo82148/actions-commit-and-create-pr@v1.1.4
